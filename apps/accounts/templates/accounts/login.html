{% extends "base.html" %}
{% load static %}

{% block title %}ShopCart | Login{% endblock %}

{% block main_content %}
<div class="min-h-[80vh] flex items-center justify-center py-20 px-4 bg-gray-50">
  <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl p-10 border border-gray-100 transition-all hover:shadow-cyan-100">
    <div class="text-center space-y-2 mb-10">
      <h1 class="text-4xl font-black text-gray-900 tracking-tight">Welcome Back</h1>
      <p class="text-gray-400 font-medium italic">Please enter your details to sign in</p>
    </div>

    {% include "alert.html" %}

    <form method="POST" action="" class="space-y-6 mt-6">
      {% csrf_token %}
      
      <div class="space-y-2">
        <label for="username" class="block text-sm font-bold text-gray-700 uppercase tracking-widest px-1">Username</label>
        <div class="relative group">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 group-focus-within:text-cyan-500 transition-colors">
            <i class="fa-solid fa-user"></i>
          </span>
          <input 
            type="text" 
            required 
            placeholder="Your identifier" 
            name="username" 
            id="username"
            class="w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all shadow-inner"
          >
        </div>
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-bold text-gray-700 uppercase tracking-widest px-1">Password</label>
        <div class="relative group">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400 group-focus-within:text-cyan-500 transition-colors">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input 
            type="password" 
            required 
            placeholder="••••••••" 
            name="password" 
            id="password"
            autocomplete="current-password" 
            class="w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all shadow-inner"
          >
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500">
          <span class="text-sm text-gray-500 group-hover:text-gray-700 transition-colors">Remember me</span>
        </label>
        <a href="#" class="text-sm font-bold text-cyan-600 hover:text-cyan-700 hover:underline underline-offset-4">Forgot password?</a>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-cyan-100 transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-lg">
          <i class="fa-solid fa-right-to-bracket"></i>
          Sign In
        </button>
      </div>

      <div class="text-center pt-4 border-t border-gray-100">
        <p class="text-gray-400">
          Don't have an account? 
          <a href="{% url 'register' %}" class="font-black text-cyan-600 hover:text-cyan-700 hover:underline underline-offset-4">Create Account</a>
        </p>
      </div>
    </form>
  </div>
</div>
{% endblock %}
